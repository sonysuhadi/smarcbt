<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowDash - Local Control Center</title>
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- HEADER -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6">
            <div>
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-cyan-500/10 border border-cyan-500/30 rounded-xl text-cyan-400">
                        <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight text-white">FlowDash Center</h1>
                        <p class="text-xs md:text-sm text-slate-400">CLI Gateway & Control Panel Dashboard</p>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold rounded-full">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    Gateway Active: localhost:4040
                </span>
            </div>
        </header>

        <!-- KARTU STATISTIK SYSTEM (GRID 3 KOLOM) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- CPU Load Card -->
            <div class="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl shadow-xl hover:border-slate-700 transition">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Penggunaan CPU</span>
                    <i data-lucide="cpu" class="w-5 h-5 text-cyan-400"></i>
                </div>
                <div class="flex items-baseline justify-between mb-3">
                    <span class="text-4xl font-extrabold text-white" id="cpu-load">--%</span>
                    <span class="text-xs text-slate-400" id="cpu-cores">-- Cores</span>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div id="cpu-bar" class="bg-cyan-400 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <!-- RAM Usage Card -->
            <div class="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl shadow-xl hover:border-slate-700 transition">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Memory / RAM</span>
                    <i data-lucide="hard-drive" class="w-5 h-5 text-indigo-400"></i>
                </div>
                <div class="flex items-baseline justify-between mb-3">
                    <span class="text-4xl font-extrabold text-white" id="ram-used">-- GB</span>
                    <span class="text-xs text-slate-400" id="ram-total">Total -- GB</span>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div id="ram-bar" class="bg-indigo-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <!-- System Uptime Card -->
            <div class="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl shadow-xl hover:border-slate-700 transition">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Uptime Komputer</span>
                    <i data-lucide="clock" class="w-5 h-5 text-emerald-400"></i>
                </div>
                <div class="text-4xl font-extrabold text-white mb-3" id="sys-uptime">-- Jam -- Min</div>
                <p class="text-xs text-slate-400">Aktif sejak boot terakhir</p>
            </div>

        </div>

        <!-- FITUR UTAMA: QUICK TOOLS & NOTEPAD -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Kolom Kiri: Quick Actions (2 Kolom di Layar Besar) -->
            <div class="lg:col-span-2 bg-slate-900/80 border border-slate-800 p-6 rounded-2xl shadow-xl">
                <div class="flex items-center gap-2 mb-6">
                    <i data-lucide="zap" class="w-5 h-5 text-amber-400"></i>
                    <h2 class="text-lg font-bold text-white">Aksi Cepat (Quick Actions)</h2>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Tombol Ping Server -->
                    <button onclick="checkPing()" class="flex items-center justify-between p-4 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 rounded-xl transition text-left group">
                        <div class="flex items-center gap-3">
                            <i data-lucide="wifi" class="w-5 h-5 text-cyan-400 group-hover:scale-110 transition-transform"></i>
                            <div>
                                <div class="text-sm font-semibold text-white">Tes Koneksi Ping</div>
                                <div class="text-xs text-slate-400" id="ping-result">Klik untuk cek laten internet</div>
                            </div>
                        </div>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
                    </button>

                    <!-- Tombol Clean Temp (Simulasi) -->
                    <button onclick="triggerToast('Log sistem berhasil diperbarui!')" class="flex items-center justify-between p-4 bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 rounded-xl transition text-left group">
                        <div class="flex items-center gap-3">
                            <i data-lucide="refresh-cw" class="w-5 h-5 text-emerald-400 group-hover:scale-110 transition-transform"></i>
                            <div>
                                <div class="text-sm font-semibold text-white">Refresh Status API</div>
                                <div class="text-xs text-slate-400">Sinkronkan data sekarang</div>
                            </div>
                        </div>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
                    </button>
                </div>
            </div>

            <!-- Kolom Kanan: Scratchpad / Catatan Kilat -->
            <div class="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex items-center gap-2 mb-4">
                        <i data-lucide="sticky-note" class="w-5 h-5 text-cyan-400"></i>
                        <h2 class="text-lg font-bold text-white">Catatan Cepat</h2>
                    </div>
                    <textarea id="quick-note" placeholder="Tulis catatan sementara di sini..." class="w-full h-32 bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500/50 resize-none"></textarea>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button onclick="saveNote()" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-600 text-slate-950 text-xs font-bold rounded-lg transition">Simpan</button>
                </div>
            </div>

        </div>

    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 right-6 bg-cyan-500 text-slate-950 px-4 py-3 rounded-xl font-medium text-sm shadow-2xl transition-all opacity-0 translate-y-4 pointer-events-none">
        Pesan Notifikasi
    </div>

    <!-- JAVASCRIPT UNTUK INTERAKSI & FETCH API -->
    <script>
        // Inisialisasi Lucide Icons
        lucide.createIcons();

        // 1. Fetch Data Real-time dari Backend Express
        async function updateDashboard() {
            try {
                const res = await fetch('/api/system');
                if (!res.ok) return;
                const data = await res.json();

                // Update CPU UI
                document.getElementById('cpu-load').innerText = `${data.cpuLoad}%`;
                document.getElementById('cpu-bar').style.width = `${data.cpuLoad}%`;

                // Update RAM UI
                const ramPercent = Math.round((data.usedRam / data.totalRam) * 100);
                document.getElementById('ram-used').innerText = `${data.usedRam} GB`;
                document.getElementById('ram-total').innerText = `Total ${data.totalRam} GB`;
                document.getElementById('ram-bar').style.width = `${ramPercent}%`;

                // Update Uptime UI
                const hours = Math.floor(data.uptime / 60);
                const mins = data.uptime % 60;
                document.getElementById('sys-uptime').innerText = `${hours}j ${mins}m`;

            } catch (error) {
                console.error('Gagal mengambil data sistem:', error);
            }
        }

        // 2. Fitur Tes Ping Sederhana
        async function checkPing() {
            const resultElem = document.getElementById('ping-result');
            resultElem.innerText = "Mengukur...";
            const start = Date.now();
            try {
                await fetch('/api/system');
                const duration = Date.now() - start;
                resultElem.innerText = `Latency: ${duration} ms (Lokal)`;
            } catch (e) {
                resultElem.innerText = "Gagal terhubung ke API";
            }
        }

        // 3. Simpan Catatan di LocalStorage Browser
        function saveNote() {
            const text = document.getElementById('quick-note').value;
            localStorage.setItem('flowdash_note', text);
            triggerToast('Catatan berhasil disimpan!');
        }

        function loadNote() {
            const saved = localStorage.getItem('flowdash_note');
            if (saved) document.getElementById('quick-note').value = saved;
        }

        // Helper Toast Notification
        function triggerToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 3000);
        }

        // Jalankan polling data setiap 2 detik sekali
        setInterval(updateDashboard, 2000);
        updateDashboard();
        loadNote();
    </script>
</body>
</html>
